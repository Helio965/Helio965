name: generate gitworld

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit: the action only publishes a stale v1.0.0 tag and
      # rebuilds dist/ on main continuously.
      - name: generate gitworld svg
        uses: Dasmat13/git-world-action@99190b9589f9af6956a106906a852603c530a648 # main, 2026-10-05
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/gitworld.svg

      - name: push svg to the output-gitworld branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-gitworld
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
