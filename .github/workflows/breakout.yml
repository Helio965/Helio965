name: generate breakout

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Writes output/light.svg and output/dark.svg, so no checkout is needed.
      - name: generate breakout svgs
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}

      - name: push breakout svgs to the output-breakout branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-breakout
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
