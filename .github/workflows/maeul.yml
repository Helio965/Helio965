name: generate maeul village

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: create output folder
        run: mkdir -p dist

      - name: generate village svgs
        uses: t1seo/maeul-in-the-sky@v2.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          hemisphere: south
          output_dir: dist

      - name: push svgs to the output-maeul branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output-maeul
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
